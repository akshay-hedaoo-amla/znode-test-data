# Framework conventions the discovery scanners rely on. Paths are relative to the framework repository roots
# set in .env (TDA_SELENIUM_REPO, TDA_PLAYWRIGHT_REPO).

selenium:
  sourceRoots: [src/main/java, src/test/java]
  constantsClass: TestDataConstants
  registryClass: TestData
  registryMethod: init
  workbooks:
    webstore: webstoreTestData.xlsx
    admin: adminTestData.xlsx
  pilots:
    - src/test/java/testClasses/integration/marketing/promotionsAndCoupons/WebstorePromotionAndCouponVerificationTest.java

playwright:
  pilots:
    - testim-migrated/tests/webstore/pdp/verify-configurable-product-details-on-pdp-variant1.spec.ts
    - testim-migrated/tests/webstore/shopping-cart/verify-amount-off-order-coupon-functionality.spec.ts

# Files whose tests run on keys (globs relative to each framework repository). The keys check
# (`bin/tda check-hardcoded`, and the Playwright repo's tda-keys-check workflow on every PR) fails if a test in them
# reads a value its approved requirement does not allow (credential, config, expected-output, created-by-test).
migrated:
  playwright:
    - testim-migrated/tests/webstore/pdp/verify-configurable-product-details-on-pdp-variant1.spec.ts
    - testim-migrated/tests/webstore/shopping-cart/verify-amount-off-order-coupon-functionality.spec.ts
    # Phase 6 module webstore/shopping-cart, stage 1 (full migration 2026-10-28; 3 shipping specs wait for SHIPPING_FLAT_RATE_ON_STORE)
    - testim-migrated/tests/webstore/shopping-cart/verify-cart-link-navigation-from-header.spec.ts
    - testim-migrated/tests/webstore/shopping-cart/verify-cart-merges-with-add-ons-when-guest-logs-in.spec.ts
    - testim-migrated/tests/webstore/shopping-cart/verify-cart-page-headers-for-guest-user.spec.ts
    - testim-migrated/tests/webstore/shopping-cart/verify-cart-page-headers-for-retail-user-with-bundle-product.spec.ts
    - testim-migrated/tests/webstore/shopping-cart/verify-cart-page-headers-for-retail-user-with-configurable-product.spec.ts
    - testim-migrated/tests/webstore/shopping-cart/verify-cart-page-headers-for-retail-user-with-group-product.spec.ts
    - testim-migrated/tests/webstore/shopping-cart/verify-cart-page-headers-for-retail-user-with-simple-product.spec.ts
    - testim-migrated/tests/webstore/shopping-cart/verify-navigation-to-home-after-continue-shopping.spec.ts
    - testim-migrated/tests/webstore/shopping-cart/verify-quantity-update-on-duplicate-save-for-later.spec.ts
