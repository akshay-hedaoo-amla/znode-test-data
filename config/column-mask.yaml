# Customer-data columns that must be masked or dropped before any value leaves the DB layer
# (security_and_access_doc.md section 6). The DB profiler never selects these, and neither does the `rows` diagnostic.
#
# Entries are "schema.table.column" or case-insensitive glob patterns ('*' = any run of characters).
# Changes go through review. Explicit entries were checked against the live schema on 2026-10-21.

columns:
  # ZnodeUser
  - dbo.ZnodeUser.Email
  - dbo.ZnodeUser.UserName
  - dbo.ZnodeUser.PhoneNumber
  - dbo.ZnodeUser.FirstName
  - dbo.ZnodeUser.LastName
  - dbo.ZnodeUser.MiddleName
  - dbo.ZnodeUser.CustomerPaymentGUID
  - dbo.ZnodeUser.RefreshToken

  # ASP.NET Identity (sign-in names and security stamps); added 2026-10-22 (user entity map review)
  - dbo.AspNetZnodeUser.UserName
  - dbo.AspNetUsers.UserName
  - dbo.AspNetUsers.NormalizedUserName
  - dbo.AspNetUsers.SecurityStamp
  - dbo.AspNetUsers.ConcurrencyStamp

  # ZnodeAddress
  - dbo.ZnodeAddress.FirstName
  - dbo.ZnodeAddress.LastName
  - dbo.ZnodeAddress.DisplayName
  - dbo.ZnodeAddress.CompanyName
  - dbo.ZnodeAddress.Address1
  - dbo.ZnodeAddress.Address2
  - dbo.ZnodeAddress.Address3
  - dbo.ZnodeAddress.CityName
  - dbo.ZnodeAddress.PostalCode
  - dbo.ZnodeAddress.PhoneNumber
  - dbo.ZnodeAddress.Mobilenumber
  - dbo.ZnodeAddress.AlternateMobileNumber
  - dbo.ZnodeAddress.FaxNumber
  - dbo.ZnodeAddress.EmailAddress

  # Payment and other plugin configuration (may hold gateway credentials); added 2026-11-02 (configuration set map, user decision)
  - "dbo.ZnodePlugin*.ConfigurationSetAttributeValues"
  - "dbo.ZnodePlugin*.PluginFeatureAttributeValues"
  - dbo.ZnodePluginDetails.GlobalConfiguration
  - dbo.ZnodePluginDetails.PluginLicense
  - dbo.ZnodePluginAttribute.PluginAttributeJson

  # Product reviews (customer-written text and names); added 2026-11-02 (review map, user decision)
  - dbo.ZnodeCMSCustomerReview.UserName
  - dbo.ZnodeCMSCustomerReview.Comments
  - dbo.ZnodeCMSCustomerReview.Headline
  - dbo.ZnodeCMSCustomerReview.UserLocation

  # Safety net for every table (orders, identity, payments, tables not mapped yet). Masking a harmless column
  # such as EmailOptIn only hides it from profiling; it never exposes anything.
  - "dbo.*.*email*"
  - "dbo.*.*phone*"
  - "dbo.*.*mobile*"
  - "dbo.*.*firstname*"
  - "dbo.*.*lastname*"
  - "dbo.*.*password*"
  - "dbo.*.*token*"
  - "dbo.*.*card*"
  - "dbo.*.*address1*"
  - "dbo.*.*postalcode*"
  - "dbo.*.*apikey*"      # API keys (e.g. ZnodeDomain.ApiKey); added 2026-10-21
  - "dbo.*.*secret*"

# Output exceptions: masked columns a run-time QUERY may return to a test, only through the stated join. The mask list
# above still applies in full to the profiler, `rows` and every agent: no agent ever reads these values. An exception
# applies only once a human fills in approvedBy and approvedAt. Changes go through review (security_and_access_doc.md
# section 6: customer personal data never leaves the database layer; warehouse addresses are store data).
outputExceptions:
  - columns:
      - dbo.ZnodeAddress.Address1
      - dbo.ZnodeAddress.Address2
      - dbo.ZnodeAddress.Address3
      - dbo.ZnodeAddress.CityName
      - dbo.ZnodeAddress.PostalCode
    onlyVia: dbo.ZnodeWarehouseAddress.AddressId   # rows that are a warehouse's address, never a user's or an order's
    usedBy: [PRODUCT_SIMPLE_WITH_ADDON_IN_STOCK, PRODUCT_CONFIGURABLE_VARIANT_OF_PARENT]
    reason: >-
      Selenium productDisplayPage inventory tests compare the default and other warehouse addresses shown on the PDP
      (store warehouse setup, not customer data). User decision 2026-11-06 (mask exception chosen over keeping the
      sheet values).
    approvedBy: Akshay Hedaoo
    approvedAt: 2026-11-06T09:00:00Z
