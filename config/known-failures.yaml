# Phase 6 rollout: tests of a module being migrated that fail for reasons outside the test data agents (Part B step 5:
# "failures that also happen without the agents go into config/known-failures.yaml with evidence"). The module run
# reports them and fails only on other failures; an entry is removable once the test passes again. Every entry needs
# evidence that the failure is pre-existing. (The Phase 4 pilots keep config/pilot-known-failures.yaml.)
# 2026-10-28: the two estimate-shipping tests were listed here after each failed once on atstage when run alone (no
# shipping option for the US zip), then removed the same day: both PASSED in the clean origin/dev baseline of the 23
# stage-1 specs (2 workers). They are intermittent, not pre-existing failures (see docs/memory.md).
knownFailures:
  - testId: "testim-migrated/tests/webstore/my-account/order-template-validate-functionality.spec.ts > Webstore - My Account - Order Template > validate order template functionality"
    reason: "Order template SKU validation differs from the recording on atstage: row 0 (configurable parent SKU) shows no validation error where 'The entered SKU is invalid.' was recorded; row 2 (out-of-stock product) shows 'This product is out of stock.' where 'The entered SKU is invalid.' was recorded; then a page wait times out"
    evidence: "Baseline 2026-11-02: run without the test data agents (no TDA_HOME, the spec's own JSON data) fails the same three checks; with the agents it fails identically in normal mode (the spec's own SKUs, z-100000 preferred) and in fallback mode."
    decidedBy: "Akshay Hedaoo"
    decidedAt: "2026-11-02"
  - testId: "testim-migrated/tests/webstore/my-account/dashboard-validate-functionality.spec.ts > Webstore - My Account - Dashboard > validate dashboard functionality"
    reason: "The dashboard's Return History card is not on the page (returnHistoryCardTitle 'Return History' not found) and a dashboard link click times out on atstage"
    evidence: "Baseline 2026-11-02: the committed original spec run without the test data agents (no TDA_HOME, its own JSON data) fails identically; with the agents it fails the same way in normal and fallback mode."
    decidedBy: "Akshay Hedaoo"
    decidedAt: "2026-11-02"
  - testId: "testim-migrated/tests/webstore/order/verify-create-return-availability.spec.ts > Webstore - Order > the Create Return control is present on a tracked order @ZPD-TC-9692 @ZPD-TC-9695"
    reason: "Tracking the shared account's most recent order (Order History row 0) shows no Create Return button on atstage; the spec's own header says Create Return is disabled for every order there. Same as the parked my-account order-history step 6 (linkCreateReturn absent on recently created orders). A return-eligible order (proposed key ORDER_OF_USER_RETURNABLE) would be needed."
    evidence: "Baseline 2026-11-04: the original spec run without migration, signed in (order/ added to AUTH_SPECS), fails on getByRole('button', { name: /create return/i }) not visible; the quote request spec in the same run passes."
